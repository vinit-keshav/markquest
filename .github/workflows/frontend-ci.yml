name: Frontend CI
on:
  push:
    paths: ['frontendr/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['frontendr/**', '.github/workflows/frontend-ci.yml']
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontendr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontendr/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
