name: Build release images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontendr/**"
      - ".github/workflows/release-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    name: Verify backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - notification-service
          - portfolio-service
          - trading-service
          - watchlist-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml
      - name: Build and test
        working-directory: backend/${{ matrix.service }}
        run: mvn -B clean test

  frontend-tests:
    name: Verify frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontendr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontendr/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, watchlist-service, trading-service, portfolio-service, notification-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${REPOSITORY,,}/${SERVICE}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'frontend' && './frontendr' || './backend' }}
          file: ${{ matrix.service == 'frontend' && './frontendr/Dockerfile' || './backend/Dockerfile' }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    needs: images
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Configure deployment SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/marketquest_cd
          chmod 600 ~/.ssh/marketquest_cd
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy commit images
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/marketquest_cd "$VPS_USER@$VPS_HOST" \
            "cd /opt/marketquest && \
             git pull --ff-only && \
             cd backend && \
             sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/' .env.deploy && \
             docker compose --env-file .env.deploy -f docker-compose.deploy.yml pull && \
             docker compose --env-file .env.deploy -f docker-compose.deploy.yml up -d --remove-orphans && \
             docker compose --env-file .env.deploy -f docker-compose.deploy.yml ps"
