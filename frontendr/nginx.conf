server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;

    # Runtime DNS permits backend containers to be replaced without rebuilding the UI.
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;

    location /api/auth/ {
        set $upstream auth-service:8081;
        proxy_pass http://$upstream$request_uri;
    }
    location /api/watchlist {
        set $upstream watchlist-service:8082;
        proxy_pass http://$upstream$request_uri;
    }
    location /api/instruments {
        set $upstream trading-service:8084;
        proxy_pass http://$upstream$request_uri;
    }
    location /api/trades {
        set $upstream trading-service:8084;
        proxy_pass http://$upstream$request_uri;
    }
    location /api/portfolio/ {
        set $upstream portfolio-service:8085;
        proxy_pass http://$upstream$request_uri;
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
