spring.application.name=watchlist-service-test
JWT_SECRET=test-only-secret-with-at-least-thirty-two-bytes
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false
spring.kafka.consumer.group-id=test
marketquest.kafka.topic.otp-requested=otp.requested
marketquest.kafka.topic.trade-executed=trade.executed
spring.mail.host=localhost
marketquest.otp.email.from=test@example.com
